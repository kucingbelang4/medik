# Pre-commit hooks configuration for Medik project
# Docs: https://pre-commit.com/

repos:
  # ============================================
  # STAGE 1: Pre-commit built-in checks
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: check-json

  # ============================================
  # STAGE 2: Code formatting (Prettier)
  # ============================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ["--write", "--bracket-same-line", "--single-attribute-per-line"]
        types_or: [javascript, ts, jsx, tsx, json, yaml, markdown, css, scss]

  # ============================================
  # STAGE 3: Linting (ESLint) - only if eslint config exists
  # ============================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.3.0
    hooks:
      - id: eslint
        args: ["--fix"]
        types_or: [javascript, ts, jsx, tsx]
        additional_dependencies:
          - "eslint@^8.56.0"
          - "eslint-config-next@^14.0.0"
          - "eslint-config-prettier@^9.1.0"
          - "@typescript-eslint/eslint-plugin@^6.19.0"
          - "@typescript-eslint/parser@^6.19.0"
        files: '\\.(js|jsx|ts|tsx)$'
        exclude: "node_modules"

  # ============================================
  # STAGE 4: Testing (ALWAYS RUN on commit)
  # ============================================
  - repo: local
    hooks:
      - id: nextjs-tests
        name: "🔬 Run Tests"
        entry: pnpm test
        language: system
        pass_filenames: false
        always_run: true
        description: "Run Next.js test suite on every commit"

  # ============================================
  # STAGE 5: Next.js Lint (only if Next.js project exists)
  # ============================================
  - repo: local
    hooks:
      - id: nextjs-lint
        name: "🔍 Next.js Lint"
        entry: pnpm lint
        language: system
        pass_filenames: false
        always_run: false
        description: "Run Next.js linter on every commit"
        files: '\\.(js|jsx|ts|tsx)$'
